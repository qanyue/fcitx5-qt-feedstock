# Personal builds are downloaded from GitHub Actions artifacts.
conda_forge_output_validation: false
github:
  user_or_org: qanyue
  repo_name: fcitx5-qt-feedstock
  branch_name: main
  tooling_branch_name: main
github_actions:
  upload_packages: false
  artifact_retention_days: 30
  triggers:
    - push
    - pull_request
    - workflow_dispatch
provider:
  linux_64: github_actions
  linux_aarch64: github_actions
  linux_ppc64le: github_actions
build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64
conda_build:
  pkg_format: '2'
workflow_settings:
  store_build_artifacts: true
skip_render:
  - README.md
