# Originally generated by conda-smithy; customized for artifact-only builds.
# Preserve the artifact upload and disabled publishing when rerendering.
# -*- mode: yaml -*-

name: Build conda package
on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.CONFIG }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix:
        include:
          - CONFIG: linux_64_
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma10
            build_workspace_dir: build_artifacts
            docker_run_args:
            free_disk_space: skip
            os: ubuntu
            pagefile_size: 0
            resize_partitions: False
            runs_on: ['ubuntu-latest']
            tools_install_dir: ~/miniforge3
          - CONFIG: linux_aarch64_
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma10
            build_workspace_dir: build_artifacts
            docker_run_args:
            free_disk_space: skip
            os: ubuntu
            pagefile_size: 0
            resize_partitions: False
            runs_on: ['ubuntu-latest']
            tools_install_dir: ~/miniforge3
          - CONFIG: linux_ppc64le_
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma10
            build_workspace_dir: build_artifacts
            docker_run_args:
            free_disk_space: skip
            os: ubuntu
            pagefile_size: 0
            resize_partitions: False
            runs_on: ['ubuntu-latest']
            tools_install_dir: ~/miniforge3
    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Configure binfmt_misc
      if: matrix.os == 'ubuntu'
      shell: bash
      run: |
        if [[ "$(uname -m)" == "x86_64" ]]; then
          docker run --rm --privileged multiarch/qemu-user-static:register --reset --credential yes
        elif [[ "$(uname -m)" == "aarch64" ]]; then
          docker run --rm --privileged --entrypoint /opt/docker/bin/register-binfmt ${{ matrix.DOCKER_IMAGE }} aarch64
        fi

    - name: Build on Linux
      id: build-linux
      if: matrix.os == 'ubuntu'
      env:
        CI: github_actions
        CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
        CONDA_FORGE_DOCKER_RUN_ARGS: ${{ matrix.docker_run_args }}
        CONFIG: ${{ matrix.CONFIG }}
        MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
        DOCKER_IMAGE: ${{ matrix.DOCKER_IMAGE }}
        UPLOAD_PACKAGES: 'False'
        RATTLER_BUILD_COLOR: always
        RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
      shell: bash
      run: |
        export CONDA_BLD_PATH="${CONDA_BLD_PATH/#~/${HOME}}"
        export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
        export GIT_BRANCH="${GITHUB_REF_NAME}"
        export MINIFORGE_HOME="${MINIFORGE_HOME/#~/${HOME}}"
        export flow_run_id="github_$GITHUB_RUN_ID"
        export remote_url="https://github.com/$GITHUB_REPOSITORY"
        export sha="$GITHUB_SHA"
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          export IS_PR_BUILD="True"
        else
          export IS_PR_BUILD="False"
        fi
        ./.scripts/run_docker_build.sh

    - name: Upload conda packages
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: fcitx5-qt6-${{ matrix.CONFIG }}
        path: ${{ matrix.build_workspace_dir }}/linux-*/*.conda
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
