{% set name = "fcitx5-qt6" %}
{% set version = "5.1.16" %}
{% set qt_version = environ.get("QT_VERSION", "6.11.3") %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/fcitx/fcitx5-qt/archive/refs/tags/{{ version }}.tar.gz

build:
  number: 1
  # conda-forge does not provide qt6-main 6.11.3 for ppc64le.
  skip: true  # [not linux or ppc64le]
  string: qt{{ qt_version | replace('.', '') }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja
    - pkg-config
    - extra-cmake-modules
    # Native Qt tools (moc/rcc) must run on the build machine when cross-compiling.
    - qt6-main {{ qt_version }}.*  # [build_platform != target_platform]
  host:
    - qt6-main {{ qt_version }}.*
    - libgl-devel
    - libxkbcommon
    - libxcb
    - xorg-libx11
    - xorg-xorgproto
  run:
    # The platform input plugin uses Qt private APIs.
    - {{ pin_compatible('qt6-main', max_pin='x.x.x') }}
    - libxkbcommon
    - libxcb
    - xorg-libx11

test:
  commands:
    - test -f $PREFIX/lib/qt6/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so
    - test -f $PREFIX/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so

about:
  home: https://github.com/fcitx/fcitx5-qt
  license: BSD-3-Clause
  summary: "Fcitx5 Qt6 Platform Input Context Plugin for Conda"
